name: Tests and Checkings

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-assets:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    steps:
      - name: Restore Geodat Cache
        uses: actions/cache/restore@v6
        with:
          path: resources
          key: xray-geodat-
      - name: Check Assets Existence
        id: check-assets
        run: |
          [ -d 'resources' ] || mkdir resources
          LIST=('geoip.dat' 'geosite.dat')
          for FILE_NAME in "${LIST[@]}"
          do
            echo -e "Checking ${FILE_NAME}..."
            if [ -s "./resources/${FILE_NAME}" ]; then
              echo -e "${FILE_NAME} exists."
            else
              echo -e "${FILE_NAME} does not exist."
              echo "missing=true" >> $GITHUB_OUTPUT
              break
            fi
          done
      - name: Sleep for 90 seconds if Assets Missing
        if: steps.check-assets.outputs.missing == 'true'
        run: sleep 90

  check-proto:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      # Auto-fix nonstandard formatting
      - name: Run gofmt Auto Fix
        run: |
          gofmt -s -w .

      # Commit formatting fixes back when needed
      - name: Auto Commit Formatted Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto format Go code (gofmt)"
          branch: ${{ github.head_ref || github.ref_name }}

  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      # golangci-lint v1.x is built with older Go and fails against go1.26.
      # Action v9 runs on Node 24 and supports golangci-lint v2.
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m --issues-exit-code=0

  test:
    runs-on: ${{ matrix.os }}
    needs: [check-assets, check-proto]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Restore Geodat Cache
        uses: actions/cache/restore@v6
        with:
          path: resources
          # scheduled-assets-update saves xray-geodat-${{sha}}-${{run_number}}.
          # Prefix restore so any recent assets cache can hit.
          key: xray-geodat-${{ github.sha }}
          restore-keys: |
            xray-geodat-
      - name: Ensure Geodat Assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p resources
          ensure_asset() {
            local name="$1"
            local url="https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/${name}"
            if [ -s "resources/${name}" ]; then
              echo "${name} present ($(wc -c < "resources/${name}") bytes)"
              return 0
            fi
            echo "Downloading ${name} from ${url}..."
            curl -fsSL --retry 5 --retry-delay 2 -o "resources/${name}" "${url}"
            if [ ! -s "resources/${name}" ]; then
              echo "failed to download ${name}" >&2
              exit 1
            fi
            echo "${name} downloaded ($(wc -c < "resources/${name}") bytes)"
          }
          ensure_asset geoip.dat
          ensure_asset geosite.dat
      - name: Test codebase
        run: |
          go env -w GONOSUMDB=*
          # Keep CI under the 120s package budget; long stress suites are skipped via testing.Short().
          go test -short -timeout 15m -count=1 ./...
        env:
          GONOSUMDB: '*'

      - name: Test with race detector (core packages)
        if: matrix.os == 'ubuntu-latest'
        run: |
          go env -w GONOSUMDB=*
          go test -race -short -timeout 10m -count=1 \
            ./transport/internet/splithttp/ \
            ./transport/internet/quality/ \
            ./transport/internet/tcpinfo/ \
            ./common/buf/ \
            ./common/randpool/ \
            ./common/utils/ \
            ./transport/internet/ \
            ./common/protocol/http/ \
            ./transport/internet/grpc/encoding/
        env:
          GONOSUMDB: '*'