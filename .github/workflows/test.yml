name: Tests and Checkings

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-assets:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    steps:
      - name: Restore Geodat Cache
        uses: actions/cache/restore@v5
        with:
          path: resources
          key: xray-geodat-
      - name: Check Assets Existence
        id: check-assets
        run: |
          [ -d 'resources' ] || mkdir resources
          LIST=('geoip.dat' 'geosite.dat')
          for FILE_NAME in "${LIST[@]}"
          do
            echo -e "Checking ${FILE_NAME}..."
            if [ -s "./resources/${FILE_NAME}" ]; then
              echo -e "${FILE_NAME} exists."
            else
              echo -e "${FILE_NAME} does not exist."
              echo "missing=true" >> $GITHUB_OUTPUT
              break
            fi
          done
      - name: Sleep for 90 seconds if Assets Missing
        if: steps.check-assets.outputs.missing == 'true'
        run: sleep 90

  check-proto:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      # 自动修复格式不规范的代码
      - name: Run gofmt Auto Fix
        run: |
          gofmt -s -w .

      # 检测代码是否被修改，若有，自动生成 Commit 机器人推回仓库
      - name: Auto Commit Formatted Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: 自动格式化 Go 代码 (gofmt 自动修复)"
          branch: ${{ github.head_ref || github.ref_name }}

  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  test:
    runs-on: ${{ matrix.os }}
    needs: [check-assets, check-proto]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Cache Geodat
        if: matrix.os == 'ubuntu-latest'
        uses: actions/cache/save@v4
        with:
          path: resources
          key: xray-geodat-${{ github.sha }}
      - name: Test codebase
        run: go test -short -timeout 120s ./...
        env:
          GONOSUMDB: '*'
          GOFLAGS: -insecure

      - name: Test with race detector (core packages)
        if: matrix.os == 'ubuntu-latest'
        run: |
          go test -race -short -timeout 120s \
            ./transport/internet/splithttp/ \
            ./transport/internet/quality/ \
            ./transport/internet/tcpinfo/ \
            ./common/buf/ \
            ./common/randpool/ \
            ./common/utils/ \
            ./transport/internet/ \
            ./common/protocol/http/ \
            ./transport/internet/grpc/encoding/
        env:
          GONOSUMDB: '*'
          GOFLAGS: -insecure
