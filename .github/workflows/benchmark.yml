name: Benchmark Tracking

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Run XMUX benchmarks
        run: |
          go test -bench=BenchmarkXMUX -benchmem -count=6 -timeout=300s \
            ./transport/internet/splithttp/ > bench_results/new_xmux.txt

      - name: Run Happy Eyeballs benchmarks
        run: |
          go test -bench='Benchmark(Score|ClampRTT)' -benchmem -count=6 -timeout=300s \
            ./transport/internet/ > bench_results/new_happy.txt

      - name: Run Warmup benchmarks
        run: |
          go test -bench='BenchmarkWarmup|BenchmarkMetrics' -benchmem -count=6 -timeout=300s \
            ./transport/internet/ > bench_results/new_warmup.txt

      - name: Run VLESS Decode benchmarks
        run: |
          go test -bench='BenchmarkDecodeHeader|BenchmarkMarshalAddons' -benchmem -count=6 -timeout=300s \
            ./proxy/vless/encoding/ > bench_results/new_vless.txt

      - name: Run Buffer benchmarks
        run: |
          go test -bench='BenchmarkNewBuffer|BenchmarkCopy|BenchmarkSplitBytes' -benchmem -count=6 -timeout=300s \
            ./common/buf/ > bench_results/new_buf.txt

      - name: Download baseline
        uses: actions/cache@v5
        with:
          path: bench_results
          key: benchmark-baseline-${{ github.base_ref || 'main' }}
          restore-keys: benchmark-baseline-

      - name: Compare benchmarks
        id: compare
        run: |
          echo "## Benchmark Results" > bench_results/report.md
          echo "" >> bench_results/report.md

          HAS_BASELINE=false
          for f in bench_results/base_*.txt; do
            if [ -f "$f" ]; then
              HAS_BASELINE=true
              break
            fi
          done

          if [ "$HAS_BASELINE" = true ]; then
            echo "### Comparison with baseline" >> bench_results/report.md
            echo "" >> bench_results/report.md
            echo '```' >> bench_results/report.md

            for name in xmux happy warmup vless buf; do
              if [ -f "bench_results/base_${name}.txt" ] && [ -f "bench_results/new_${name}.txt" ]; then
                echo "=== ${name} ===" >> bench_results/report.md
                benchstat bench_results/base_${name}.txt bench_results/new_${name}.txt >> bench_results/report.md 2>&1 || true
                echo "" >> bench_results/report.md
              fi
            done

            echo '```' >> bench_results/report.md
          else
            echo "No baseline found. This is the first run." >> bench_results/report.md
            echo "Baseline will be saved after merge to main." >> bench_results/report.md
          fi

          echo "" >> bench_results/report.md
          echo "### Current Results" >> bench_results/report.md
          echo "" >> bench_results/report.md
          echo '```' >> bench_results/report.md
          for f in bench_results/new_*.txt; do
            if [ -f "$f" ]; then
              echo "--- $(basename $f .txt) ---" >> bench_results/report.md
              cat "$f" >> bench_results/report.md
              echo "" >> bench_results/report.md
            fi
          done
          echo '```' >> bench_results/report.md

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('bench_results/report.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });

      - name: Save baseline
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          for name in xmux happy warmup vless buf; do
            if [ -f "bench_results/new_${name}.txt" ]; then
              cp "bench_results/new_${name}.txt" "bench_results/base_${name}.txt"
            fi
          done

      - name: Cache baseline
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/cache/save@v5
        with:
          path: bench_results/base_*.txt
          key: benchmark-baseline-main-${{ github.sha }}
