run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

linters-settings:
  errcheck:
    exclude-functions:
      - (io.Closer).Close
      - (net.Listener).Close
      - (net.Conn).Close
      - (os.File).Close
      - fmt.Print
      - fmt.Println
      - fmt.Printf

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
    - path: \.pb\.go
      linters:
        - errcheck
        - unused
