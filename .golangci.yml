version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (net.Listener).Close
        - (net.Conn).Close
        - (os.File).Close
        - fmt.Print
        - fmt.Println
        - fmt.Printf
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
      - path: \.pb\.go
        linters:
          - errcheck
          - unused
